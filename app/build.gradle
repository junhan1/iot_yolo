plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'com.example.rknncamera'; compileSdk 35
    defaultConfig { applicationId 'com.example.rknncamera'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.5' } }
    // ⭐ 添加这部分：统一 JVM 目标版本
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}